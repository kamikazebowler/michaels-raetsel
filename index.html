<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#7a2e1f">
<title>Michaels Rätsel 🔎</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔎</text></svg>">
<style>
  :root { --bg:#fbf6ee; --card:#fff; --ink:#2b2320; --muted:#8a7d74; --accent:#7a2e1f; --gold:#c8962e; --ok:#2f7d4a; --line:#eadfce; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); line-height:1.45; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 64px; }
  header { text-align:center; margin-bottom:20px; }
  h1 { font-family: Georgia, "Times New Roman", serif; color:var(--accent); font-size:2rem; margin:.2em 0; }
  .sub { color:var(--muted); margin:0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin:12px 0; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .clue { display:flex; gap:14px; align-items:flex-start; }
  .num { flex:0 0 36px; height:36px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; font-weight:700; }
  .clue.locked { opacity:.55; }
  .clue.locked .num { background:var(--muted); }
  .clue.new { animation: pop .6s ease; border-color:var(--gold); }
  @keyframes pop { 0%{transform:scale(.96)} 60%{transform:scale(1.02)} 100%{transform:scale(1)} }
  .time { font-size:.8rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .next { text-align:center; font-size:.95rem; color:var(--muted); }
  .next b { color:var(--accent); font-variant-numeric: tabular-nums; }
  form { display:flex; gap:8px; }
  input { flex:1; font-size:1rem; padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:#fff; }
  button { font-size:1rem; padding:12px 16px; border:0; border-radius:12px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; }
  #fb { min-height:1.4em; margin:10px 2px 0; font-weight:500; }
  .hot { color:#c0392b; } .warm { color:#d0801a; } .cold { color:#3b6ea5; }
  .meta { font-size:.8rem; color:var(--muted); margin-top:6px; }
  #win { display:none; text-align:center; border:2px solid var(--gold); }
  #win h2 { font-family: Georgia, serif; color:var(--accent); margin:.2em 0; font-size:1.8rem; }
  #win .addr { font-size:1.1rem; margin:.3em 0; }
  #win a.btn { display:inline-block; margin-top:12px; text-decoration:none; background:var(--ok); color:#fff; padding:12px 18px; border-radius:12px; font-weight:600; }
  footer { text-align:center; color:var(--muted); font-size:.8rem; margin-top:24px; }
  .confetti { position:fixed; top:-20px; font-size:22px; pointer-events:none; animation: fall linear forwards; z-index:9; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
</style>
</head>
<body>
<main>
  <header>
    <div style="font-size:2.4rem">🍽️🔎</div>
    <h1>Wo essen wir heute, Michael?</h1>
    <p class="sub">Heute Abend, 19:00 Uhr – Deine Freunde warten. Aber wo? Über den Tag verteilt tauchen hier Hinweise auf. Errate den Ort!</p>
  </header>

  <section id="win" class="card"></section>

  <section class="card" id="guessCard">
    <form id="f" autocomplete="off">
      <input id="g" placeholder="Name des Lokals oder Adresse…" aria-label="Dein Tipp">
      <button id="b">Raten</button>
    </form>
    <div id="fb"></div>
    <div class="meta" id="tries"></div>
  </section>

  <div class="next" id="next"></div>
  <section id="clues"></section>

  <footer>Tipp: Seite einfach offen lassen oder später neu laden – neue Hinweise erscheinen automatisch.</footer>
</main>
<script>

30T14:30:00+02:00","x":"zy4nwDiL1kTM0EDIshWY6RXalxGdz9GUgwiZy9GZuVGboVmWtoHdpx2ZlR3UgsmcppXZCBiLuVGdzV2dkx7wTBibl5GvDL3Zg4WZkBibpBCdoV2ZgMXZgIXZiFGITCo4g4WasJXZCBibpBCdzJWalxmYgUHR"},{"t":"2026-09-30T16:00:00+02:00","x":"Pi77Iyp4g4Cdsl2ZgwJgiX2ajx7wyJGdmVHTgIXZkBiclRXYW5JgiDycsFGIyVGZgwycsFmcl5WZH1yUVBycl5WalBibl1WYOBiblRGI0dGpDLHdgU2nDHmc0NFIllGR"},{"t":"2026-09-30T17:00:00+02:00","x":"=comfCPIukSbpVGStUmblxWZI1icht2cPhCIhRGIuVGd15WaNBibldWauV2dg4WagUHRgQ3cpJGIzUFIyVGZgQXaNBiLulGbyVmQg4Wag4WZ0JXZplGbsFEIllGZg4WYg0WdlNXdNBibpVGI0JXZu5WayVGIyVmY8OsbldWZnByZkOscoN2U"},{"t":"2026-09-30T17:45:00+02:00","x":"=A7jiDSIuV2czV2ZldGIkJXa3BicoVFIwAjO5EDItVHITCo4gM3bsBiclJWYgQne0VmSg4iN0EDIyVWbtVnbzVXYIBiOzlWZ35WaIBiclRne0VGT"}]};
const enc = new TextEncoder(), dec = new TextDecoder();
const $ = id => document.getElementById(id);
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
const unob = s => { const b = atob(s.split('').reverse().join('')); return dec.decode(Uint8Array.from(b, ch => ch.charCodeAt(0))); };
const b64 = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
const hex = buf => [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2,'0')).join('');
const sha = async s => hex(await crypto.subtle.digest('SHA-256', enc.encode(D.salt + '|' + s)));

// Time override for testing: ?t=2026-09-30T15:00
const qs = new URLSearchParams(location.search);
const offset = qs.get('t') ? new Date(qs.get('t') + ':00+02:00') - Date.now() : 0;
const now = () => new Date(Date.now() + offset);

const LS = 'mr-state-v1';
const state = JSON.parse(localStorage.getItem(LS) || '{"tries":0,"seen":0,"won":null}');
const save = () => localStorage.setItem(LS, JSON.stringify(state));

const fmt = d => d.toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit', timeZone:'Europe/Berlin' });
const dur = ms => { const s = Math.max(0, Math.floor(ms/1000)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h + ' h ' : '') + String(m).padStart(2,'0') + ' min ' + String(x).padStart(2,'0') + ' s'; };

let lastShown = -1;
function render() {
  const t = now();
  const open = D.clues.filter(c => new Date(c.t) <= t).length;
  if (open !== lastShown) {
    const html = D.clues.map((c, i) => {
      const at = new Date(c.t);
      if (i < open) {
        const isNew = i >= state.seen;
        return `<div class="card clue ${isNew ? 'new' : ''}"><div class="num">${i+1}</div><div><div class="time">Hinweis ${i+1} · ${fmt(at)} Uhr</div>${unob(c.x)}</div></div>`;
      }
      return `<div class="card clue locked"><div class="num">${i+1}</div><div><div class="time">Hinweis ${i+1}</div>🔒 Wird um ${fmt(at)} Uhr freigeschaltet.</div></div>`;
    }).reverse();
    // newest unlocked clue on top, locked ones below
    const unlocked = html.slice(D.clues.length - open), locked = html.slice(0, D.clues.length - open).reverse();
    $('clues').innerHTML = unlocked.join('') + locked.join('');
    if (open > state.seen) { state.seen = open; save(); if (lastShown !== -1 && navigator.vibrate) navigator.vibrate(200); }
    lastShown = open;
  }
  const nxt = D.clues[open];
  if (state.won) $('next').innerHTML = '';
  else if (nxt) $('next').innerHTML = open === 0 && new Date(D.clues[0].t) - t > 12*3600e3
      ? `Das Rätsel startet am <b>30.09.2026 um ${fmt(new Date(nxt.t))} Uhr</b>. Geduld! 😉`
      : `Nächster Hinweis in <b>${dur(new Date(nxt.t) - t)}</b>`;
  else $('next').innerHTML = 'Alle Hinweise sind draußen – jetzt musst Du es wissen! 😄';
}

function ngrams(s) {
  const w = s.split(' '), out = new Set([s]);
  for (let n = 1; n <= 4; n++) for (let i = 0; i + n <= w.length; i++) out.add(w.slice(i, i+n).join(' '));
  return [...out];
}

async function decryptReveal(phrase, packed) {
  const [iv, ct] = packed.split('.').map(b64);
  const base = await crypto.subtle.importKey('raw', enc.encode(phrase), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:enc.encode(D.salt), iterations:100000, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  return JSON.parse(dec.decode(await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, ct)));
}

function showWin(r) {
  $('win').innerHTML = `<div style="font-size:2.6rem">🎉🍕🍷</div><h2>${r.name}</h2>
    <div class="addr">${r.addr}</div><div>${r.time}</div>
    <p>Richtig, Michael! Nach ${state.tries} ${state.tries === 1 ? 'Versuch' : 'Versuchen'} geknackt. Wir freuen uns auf Dich! 🥂</p>
    <a class="btn" href="${r.maps}" target="_blank" rel="noopener">📍 Route in Google Maps</a>`;
  $('win').style.display = 'block';
  $('guessCard').style.display = 'none';
  render();
}

function confetti() {
  const e = ['🎉','🍕','🍝','🍷','🇮🇹','✨','🥂'];
  for (let i = 0; i < 60; i++) { const s = document.createElement('div'); s.className = 'confetti';
    s.textContent = e[i % e.length]; s.style.left = Math.random()*100 + 'vw';
    s.style.animationDuration = 2.5 + Math.random()*2.5 + 's'; s.style.animationDelay = Math.random()*1.2 + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 6500); }
}

const COLD = ['Nope, das ist es nicht. 🙃', 'Leider daneben!', 'Kalt, ganz kalt… 🥶', 'Netter Versuch – aber nein.', 'Hmm, nein. Lies die Hinweise nochmal genau! 🔎'];
$('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const raw = $('g').value; const s = norm(raw); if (!s) return;
  $('b').disabled = true;
  state.tries++; save();
  const grams = ngrams(s); const hashes = await Promise.all(grams.map(sha));
  for (let i = 0; i < grams.length; i++) {
    const hit = D.acc.find(a => a.h === hashes[i]);
    if (hit) {
      try { const r = await decryptReveal(grams[i], hit.c); state.won = { phrase: grams[i], c: hit.c }; save(); showWin(r); confetti(); return; }
      catch (e) { /* fall through */ }
    }
  }
  const has = k => hashes.some(h => D.hints[k].includes(h));
  let msg, cls;
  if (has('hot')) { msg = '🔥 Heiß! Da steckt schon ein echtes Stück der Lösung drin – aber noch nicht ganz. Nenn mir den vollen Namen oder die genaue Adresse!'; cls = 'hot'; }
  else if (has('area')) { msg = '📍 Warm! Die Gegend stimmt – aber welches Lokal genau?'; cls = 'warm'; }
  else if (has('food')) { msg = '🍝 Die Richtung stimmt! Aber welches Restaurant?'; cls = 'warm'; }
  else { msg = COLD[state.tries % COLD.length]; cls = 'cold'; }
  $('fb').className = cls; $('fb').textContent = msg;
  $('tries').textContent = state.tries + (state.tries === 1 ? ' Versuch' : ' Versuche') + ' bisher';
  $('b').disabled = false;
});

(async () => {
  if (state.tries) $('tries').textContent = state.tries + (state.tries === 1 ? ' Versuch' : ' Versuche') + ' bisher';
  render(); setInterval(render, 1000);
  if (state.won) { try { showWin(await decryptReveal(state.won.phrase, state.won.c)); } catch (e) { state.won = null; save(); } }
})();
</script>
</body>
</html>
